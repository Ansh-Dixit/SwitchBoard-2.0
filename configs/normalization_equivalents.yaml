# SwitchBoard Reviewed Spelling Equivalents and Cross-Script Canonicalization Table
# Policy:
# 1. All raw transcripts and hypotheses are preserved verbatim for audit and raw WER/CER scoring.
# 2. For normalized scoring:
#    a. Unicode NFC normalization is applied, standardizing composite Devanagari nukta characters.
#    b. Case is folded to lowercase (ASCII/Latin).
#    c. Punctuation (ASCII punctuation, Devanagari purna viram '।', double danda '॥', smart quotes, hyphens) is stripped.
#    d. Reviewed cross-script and Romanized spelling variants below are mapped to a canonical token
#       so that script differences (e.g., "मीटिंग" vs "meeting", "कल" vs "kal") do not inflate word error rates,
#       while genuine lexical errors (e.g., "meeting" vs "eating", "report" vs "deport") still count as errors.
#    e. Original reference word-level language tags (HI, EN, OTHER) stay bound to their normalized reference token index.

