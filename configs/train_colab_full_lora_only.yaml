# Full Colab GPU Configuration 1: Whisper Small LoRA Alone (Ablation Baseline)
experiment_name: "colab_full_whisper_small_lora_only"
run_tier: "full_research"
base_model_name_or_path: "openai/whisper-small"
allow_tiny_architecture_for_cpu_smoke: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
  decoder_attention_only: true

auxiliary_lid:
  enabled: false
  lid_loss_weight: 0.0
  num_labels: 3
  hidden_dropout: 0.1

curriculum:
  enabled: true
  stages:
    - name: "stage1_monolingual"
      description: "Stage 1: Monolingual speech (Kathbath HI + Common Voice HI & EN)"
      filter_mode: "monolingual"
      epochs: 2
      learning_rate: 2.0e-4
    - name: "stage2_real_mixed"
      description: "Stage 2: Real code-switched speech (MUCS 2021 HI-EN + Team Unscripted Recordings)"
      filter_mode: "real_mixed"
      epochs: 4
      learning_rate: 1.0e-4
    - name: "stage3_synthetic_supplement"
      description: "Stage 3 (Optional): Real mixed + Synthetic mixed speech supplement"
      filter_mode: "all_with_synthetic"
      epochs: 2
      learning_rate: 5.0e-5

training:
  batch_size: 16
  gradient_accumulation_steps: 2
  max_steps_per_stage: 2500
  fp16: true
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  output_dir: "checkpoints/colab_full_whisper_small_lora_only"
  manifest_path: "data/full_corpus/unified_manifest.jsonl"
